<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora Home — Support Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e8ede9 0%, #d6cfc4 50%, #c9d4ca 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
  }

  .brand {
    font-size: 22px;
    letter-spacing: 2px;
    color: #3a3a38;
    margin-bottom: 8px;
    font-weight: 300;
  }

  .subtitle {
    font-size: 13px;
    color: #7a8c7b;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  .chat-box {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .chat-header {
    background: #8a9e8c;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .online-dot {
    width: 8px;
    height: 8px;
    background: #c8f0ca;
    border-radius: 50%;
  }

  .chat-header span {
    color: white;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .messages {
    height: 360px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  .message.bot {
    background: #f0f4f0;
    color: #2c2c2a;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .message.user {
    background: #8a9e8c;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .typing {
    font-size: 13px;
    color: #8a9e8c;
    padding: 6px 14px;
    align-self: flex-start;
  }

  .input-area {
    display: flex;
    padding: 14px 16px;
    gap: 10px;
    border-top: 1px solid #e8ede9;
    background: white;
  }

  input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #d6cfc4;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    color: #2c2c2a;
    background: #fafaf8;
  }

  input:focus { border-color: #8a9e8c; }

  button {
    background: #8a9e8c;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #7a8e7c; }
  button:disabled { background: #c4b9a8; cursor: not-allowed; }
</style>
</head>
<body>

<div class="brand">LUMORA HOME</div>
<div class="subtitle">Support Chat — Workflow Test</div>

<div class="chat-box">
  <div class="chat-header">
    <div class="online-dot"></div>
    <span>Lumi — Lumora Home Support</span>
  </div>

  <div class="messages" id="messages">
    <div class="message bot">Hi! I'm Lumi, your Lumora Home assistant. Ask me anything about our products, shipping, returns or orders.</div>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const WEBHOOK = 'https://cebin99345.app.n8n.cloud/webhook/0f59b8a3-6390-4ed8-a651-4a3342942814';

  async function sendMessage() {
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    // User message
    messages.innerHTML += `<div class="message user">${text}</div>`;
    input.value = '';
    btn.disabled = true;

    // Typing indicator
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typing';
    typing.textContent = 'Lumi is typing...';
    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: text, sessionId: 'lumora-demo-001' })
      });

      const data = await res.json();
      const reply = data.output || data.text || data.message || JSON.stringify(data);

      document.getElementById('typing')?.remove();
      messages.innerHTML += `<div class="message bot">${reply.replace(/\n/g, '<br>')}</div>`;
    } catch (err) {
      document.getElementById('typing')?.remove();
      messages.innerHTML += `<div class="message bot">Connection error. Please contact hello@lumorahome.com</div>`;
    }

    btn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
